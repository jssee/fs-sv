name: fs-sv

services:
  postgres:
    image: postgres
    container_name: fs-sv-postgres
    environment:
      POSTGRES_DB: fs-sv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - fs-sv_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  fs-sv_postgres_data:
